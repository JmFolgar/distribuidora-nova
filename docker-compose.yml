services:
  postgres:
    image: postgres:16-alpine
    container_name: distribuidora-nova-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova123
      POSTGRES_DB: distribuidora_nova
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d distribuidora_nova"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
